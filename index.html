<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyahe Express</title>
    
    <!-- Opisyal na Telegram API -->
    <script src="https://telegram.org"></script>
    
    <!-- Tamang link ng Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        /* Map Container at Overlay */
        .map-container {
            position: relative;
            margin-bottom: 15px;
        }
        #map {
            height: 200px;
            border-radius: 12px;
            border: 2px solid #2481cc;
            background-color: #f0f0f0;
            z-index: 1;
        }

        /* 🌀 ISTILO NG RADAR ANIMATION OVERLAY */
        #radar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(36, 129, 204, 0.4); /* Transparent blue screen */
            border-radius: 12px;
            z-index: 10; /* Mas mataas sa mapa para matakpan ito */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            display: none; /* Nakatago muna sa simula */
        }

        /* Ang mismong umiikot na linya ng radar */
        .radar-circle {
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff; /* Kulay puti ang umiikot na dulo */
            animation: spin 1.5s linear infinite;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .fare-box {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            color: #2481cc;
        }
        .btn-book {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚗 Biyahe Express</h2>
        
        <!-- MAP AREA WITH RADAR OVERLAY -->
        <div class="map-container">
            <div id="map"></div>
            
            <!-- DITO LALABAS ANG GUMAGALAW NA RADAR -->
            <div id="radar-overlay">
                <div class="radar-circle"></div>
                <div id="radar-text">Naghahanap ng driver...</div>
            </div>
        </div>

        <!-- FORM INTERFACE -->
        <div id="booking-form">
            <div class="input-group">
                <input type="text" id="pickup" placeholder="📍 Mula (Pick-up)" oninput="updateFare()">
            </div>

            <div class="input-group">
                <input type="text" id="dropoff" placeholder="🏁 Patungo (Drop-off)" oninput="updateFare()">
            </div>

            <div class="fare-box">
                Estimated Fare: ₱<span id="fare-amount">120.00</span>
            </div>

            <button class="btn-book" onclick="startRadarSearch()">Maghanap ng Driver</button>
        </div>
    </div>

    <script>
        // I-set up ang MAPA
        var map = L.map('map').setView([14.5995, 120.9842], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([14.5995, 120.9842]).addTo(map).bindPopup('Maynila').openPopup();

        function updateFare() {
            var p = document.getElementById('pickup').value;
            var d = document.getElementById('dropoff').value;
            var amt = document.getElementById('fare-amount');
            if(p.length > 1 && d.length > 1) {
                var total = 45 + (p.length + d.length) * 5;
                amt.innerText = total + ".00";
            }
        }

        // 🌀 H

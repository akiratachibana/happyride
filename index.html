<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyahe Express</title>
    <!-- Isinasama nito ang opisyal na Telegram Web Apps API -->
    <script src="https://telegram.org"></script>
    
    <!-- Isinasama ang libreng MAPA (Leaflet CSS at JS) -->
    <!-- ITO ANG TAMA AT KUMPLETONG LINK NG MAPA -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .welcome-msg {
            font-size: 14px;
            margin-bottom: 15px;
            color: var(--tg-theme-hint-color, #707579);
        }
        
        /* Istilo ng MAPA */
        #map {
            height: 180px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border: 2px solid var(--tg-theme-button-color, #2481cc);
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
        }
        
        /* Fare Box */
        .fare-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
            color: var(--tg-theme-button-color, #2481cc);
            display: none;
        }

        .btn-book {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">🚗 Biyahe Express</div>
        <p class="welcome-msg">Kamusta, <strong id="passenger-name">Biyahero</strong>!</p>

        <!-- LIVE MAPA -->
        <div id="map"></div>

        <!-- Booking Form Interface -->
        <div class="input-group">
            <label>📍 Mula (Pick-up Point)</label>
            <input type="text" id="pickup" placeholder="Ilagay ang iyong lokasyon" oninput="calculateFare()">
        </div>

        <div class="input-group">
            <label>🏁 Patungo (Drop-off Point)</label>
            <input type="text" id="dropoff" placeholder="Saan kita ihahatid?" oninput="calculateFare()">
        </div>

        <!-- Presyohan -->
        <div id="fare-container" class="fare-box">
            Estimated Fare: ₱<span id="fare-amount">0.00</span>
        </div>

        <button class="btn-book" onclick="startBooking()">Maghanap ng Driver</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('passenger-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        // I-set up ang MAPA (Naka-focus sa Maynila, Pilipinas)
        const map = L.map('map').setView([14.5995, 120.9842], 12); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([14.5995, 120.9842]).addTo(map)
            .bindPopup('Kasalukuyang Lokasyon')
            .openPopup();

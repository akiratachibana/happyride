<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyahe Express</title>
    
    <!-- Opisyal na Telegram API -->
    <script src="https://telegram.org"></script>
    
    <!-- Tamang link ng Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        #map {
            height: 200px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid #2481cc;
            background-color: #f0f0f0;
        }
        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .fare-box {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            color: #2481cc;
        }
        .btn-book {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚗 Biyahe Express</h2>
        
        <!-- DITO LALABAS ANG MAPA -->
        <div id="map"></div>

        <div class="input-group">
            <input type="text" id="pickup" placeholder="📍 Mula (Pick-up)" oninput="updateFare()">
        </div>

        <div class="input-group">
            <input type="text" id="dropoff" placeholder="🏁 Patungo (Drop-off)" oninput="updateFare()">
        </div>

        <div class="fare-box">
            Estimated Fare: ₱<span id="fare-amount">120.00</span>
        </div>

        <button class="btn-book" onclick="bookNow()">Maghanap ng Driver</button>
    </div>

    <script>
        // Pilitin nating i-load ang mapa agad nang walang kondisyon
        try {
            var map = L.map('map').setView([14.5995, 120.9842], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([14.5995, 120.9842]).addTo(map).bindPopup('Maynila').openPopup();
        } catch(e) {
            console.log("Map error: ", e);
        }

        function updateFare() {
            var p = document.getElementById('pickup').value;
            var d = document.getElementById('dropoff').value;
            var amt = document.getElementById('fare-amount');
            if(p.length > 1 && d.length > 1) {
                var total = 45 + (p.length + d.length) * 5;
                amt.innerText = total + ".00";
            }
        }

        function bookNow() {
            alert("🚀 Naghahanap na ng driver para sa iyong biyahe!");
        }
    </script>
</body>
</html>

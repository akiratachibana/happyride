<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyahe Express</title>
    
    <!-- Opisyal na Telegram API -->
    <script src="https://telegram.org"></script>
    
    <!-- Tamang link ng Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .map-container {
            position: relative;
            margin-bottom: 15px;
        }
        #map {
            height: 200px;
            border-radius: 12px;
            border: 2px solid #2481cc;
            background-color: #f0f0f0;
            z-index: 1;
        }

        /* 🌀 RADAR ANIMATION OVERLAY */
        #radar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(36, 129, 204, 0.7);
            border-radius: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            display: none;
        }

        .radar-circle {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .fare-box {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            color: #2481cc;
        }
        .btn-book {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 🚗 DRIVER PROFILE CARD */
        #driver-card {
            background-color: #f9f9f9;
            border: 2px solid #4cd964;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
        }
        .driver-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .driver-avatar {
            width: 50px;
            height: 50px;
            background-color: #2481cc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .driver-details h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #333;
        }
        .driver-details p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }
        .driver-rating {
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚗 Biyahe Express</h2>
        
        <div class="map-container">
            <div id="map"></div>
            <div id="radar-overlay">
                <div class="radar-circle"></div>
                <div>Naghahanap ng driver...</div>
            </div>
        </div>

        <div id="booking-form">
            <div class="input-group">
                <input type="text" id="pickup" placeholder="📍 Mula (Pick-up)" oninput="updateFare()">
            </div>

            <div class="input-group">
                <input type="text" id="dropoff" placeholder="🏁 Patungo (Drop-off)" oninput="updateFare()">
            </div>

            <div class="fare-box">
                Estimated Fare: ₱<span id="fare-amount">120.00</span>
            </div>

            <button class="btn-book" id="book-btn" onclick="startRadarSearch()">Maghanap ng Driver</button>
        </div>

        <!-- DRIVER CARD -->
        <div id="driver-card">
            <div class="driver-info">
                <div class="driver-avatar">👨‍✈️</div>
                <div class="driver-details">
                    <h4>Kuya Jojo Mendoza</h4>
                    <p>🚗 Toyota Vios • <b>NQR 2026</b></p>
                    <div class="driver-rating">⭐ 4.9 (Top Driver)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // I-initialize ang mapa
        var map = L.map('map').setView([14.5995, 120.9842], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([14.5995, 120.9842]).addTo(map).bindPopup('Maynila').openPopup();

        function updateFare() {
            var p = document.getElementById('pickup').value;
            var d = document.getElementById('dropoff').value;
            var amt = document.getElementById('fare-amount');
            if(p.length > 1 && d.length > 1) {
                var total = 45 + (p.length + d.length) * 5;
                amt.innerText = total + ".00";
            }
        }

        function startRadarSearch() {
            var p = document.getElementById('pickup').value;
            var d = document.getElementById('dropoff').value;
            var fare = document.getElementById('fare-amount').innerText;

            if (!p || !d) {
                alert("⚠️ Pakisuyong punan ang Pick-up at Drop-off points!");
                return;
            }

            // Ipakita ang Radar
            document.getElementById('radar-overlay').style.display = 'flex';
            document.getElementById('driver-card').style.display = 'none';
            document.getElementById('book-btn').disabled = true;
            document.getElementById('book-btn').innerText = "Naghahanap...";

            // 4 Segundos simulation bago lumabas ang driver card
            setTimeout(function() {
                document.getElementById('radar-overlay').style.display = 'none';
                document.getElementById('book-btn').disabled = false;
                document.getElementById('book-btn').innerText = "Mag-book Ulit";
                document.getElementById('driver-card').style.display = 'block';
                
                alert(`✅ Driver Matched!\n\nSi Kuya Jojo (NQR 2026) ay papunta na para sunduin ka sa ${p}!`);
            }, 4000); 
        }
    </script>
</body>
</html>
